                    <div class="user-actions">

                </div>
                <div class="user-item">
                    <div class="avatar">

                    </div>
                    <div class="user-info">
                        <div class="nome">Lucas da Silva Galvão</div>
                        <div class="cargo">GESTOR</div>
                    </div>
                    <div class="user-actions">

                    </div>

            </div>
        </section>

        <section class="card">

            <h2>CADASTRO</h2>

            <form id="formCadastro">

                <label for="nomeCompleto">NOME</label>
                <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Nome completo" required>

                <label for="email">E-MAIL</label>
                <input type="email" id="email" name="email" placeholder="nome@empresa.com.br" required>

                <label for="cargo">PERFIL</label>
                <select id="cargo" name="cargo" required>
                    <option value="" disabled selected>
                        Selecione o perfil
                    </option>
                    <option value="analista">Analista</option>
                    <option value="gestor">Gestor</option>
                    <option value="rh">RH</option>
                </select>

                <label for="senha">SENHA</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••••••" required>

                <label for="confirmarSenha">CONFIRMAÇÃO DE SENHA</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••••••" required>

                <div class="btn-finalizar-wrap">
                    <button class="btn-finalizar" type="submit">
                        FINALIZAR
                    </button>
                </div>

            </form>

        </section>
